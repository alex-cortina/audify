[package]
name = "audify"
version = "0.1.0"
description = "A small, fast audio file editor."
authors = ["Alex"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mp3lame-encoder = "0.2.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-adapter-libopus = "0.3.0"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# The C audio libraries (libopus, LAME) are built for speed, not size: decoding and MP3
# encoding are the slow parts of opening and exporting a song.
[profile.release.package.opusic-sys]
opt-level = 3

[profile.release.package.mp3lame-sys]
opt-level = 3

[target."cfg(windows)".dependencies]
webview2-com = "0.39.1"
windows-core = "0.62"
